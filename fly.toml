# Fly.io deployment — one machine, one origin, one scheduler.
#
# The single-machine constraint is not a cost decision, it is D41. Ingestion runs as an
# asyncio task inside this process and SQLite is a file on a volume, so a second machine
# would mean two schedulers writing the same review windows to two different databases.
# `auto_stop_machines` is off for the same reason: a stopped machine is a scheduler that
# is not running, and "nothing changed" would then be indistinguishable from "nobody
# looked" — the one confusion this product exists to prevent (D15).

app = "smart-market-watchlist"
primary_region = "bom"          # Mumbai: the securities are Indian and so are the sources.

[build]
  dockerfile = "Dockerfile"

[env]
  SMART_WATCHLIST_MODE = "live"
  WATCHLIST_DB = "/data/watchlist.db"
  WEB_DIST = "/app/web"
  INGEST_SCHEDULER = "on"
  INGEST_ON_STARTUP = "on"
  INGEST_INTERVAL_MINUTES = "15"
  # A judge reaches the product without signing up. Every anonymous visitor shares one
  # server-owned account, which is the right trade for a demo and the wrong one for real
  # users — see README, "Demo mode".
  DEMO_MODE = "on"

[[mounts]]
  source = "swl_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# Liveness only. Source health is a domain verdict and lives at /v1/scheduler.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
